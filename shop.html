<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Shop &mdash; GreenBasket
  </title>
  <link href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;🥕&lt;/text&gt;&lt;/svg&gt;" rel="icon"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="site-header">
  </div>
  <main>
   <section class="page-hero">
    <div class="container">
     <h1>
      The full shop
     </h1>
     <p class="lede">
      Every fruit, vegetable, loaf and pantry staple we carry &mdash; filter by aisle, or search for what you need.
     </p>
    </div>
   </section>
   <section class="section" style="padding-top:8px;">
    <div class="container shop-layout">
     <aside class="filter-rail" id="filter-rail">
     </aside>
     <div>
      <div class="toolbar">
       <div class="search-box" style="min-width:100%;">
        <span>
         🔎
        </span>
        <input id="shop-search" placeholder="Search products like rice, paneer, chicken or spices&hellip;" type="text"/>
       </div>
       <span class="result-count" id="result-count">
       </span>
       <select class="sort-select" id="sort-select">
        <option value="featured">
         Sort: Featured
        </option>
        <option value="price-asc">
         Price: Low to High
        </option>
        <option value="price-desc">
         Price: High to Low
        </option>
        <option value="name">
         Name: A&ndash;Z
        </option>
       </select>
      </div>
      <div class="product-grid" id="product-grid">
      </div>
     </div>
    </div>
   </section>
  </main>
  <div id="site-footer">
  </div>
  <div id="cart-drawer-root">
  </div>
  <div id="carrot-root">
  </div>
  <script src="js/data.js">
  </script>
  <script src="js/chrome.js">
  </script>
  <script src="js/cart.js">
  </script>
  <script src="js/basil.js">
  </script>
  <script src="js/product-ui.js">
  </script>
  <script src="js/shop.js">
  </script>
 </body>
</html>
